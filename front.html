<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- =========================================================
         ETAPA 1 - CONFIGURAÇÕES INICIAIS DO DOCUMENTO
         ========================================================= -->

    <meta charset="UTF-8">

    <!-- Permite que a página seja responsiva em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Produtos - Ralf Lima</title>


    <!-- =========================================================
         ETAPA 2 - IMPORTAÇÃO DO BOOTSTRAP
         ========================================================= -->

    <!--
        Bootstrap será utilizado para:
        - Layout
        - Formulários
        - Botões
        - Tabela
        - Modal
        - Alertas
        - Responsividade
    -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================================
         ETAPA 3 - ESTILOS PERSONALIZADOS
         ========================================================= -->

    <style>

        /*
         * Define uma cor de fundo suave para a aplicação.
         */
        body {
            background-color: #f5f7fa;
        }

        /*
         * Cabeçalho principal.
         */
        .header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        /*
         * Cartões utilizados na interface.
         */
        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /*
         * Espaçamento entre os botões de ação.
         */
        .btn-action {
            margin-right: 5px;
        }

        /*
         * Quando não existirem produtos,
         * essa mensagem ficará centralizada.
         */
        .empty-message {
            padding: 40px;
            text-align: center;
            color: #6c757d;
        }

        /*
         * Deixa a tabela visualmente mais agradável.
         */
        .table th {
            white-space: nowrap;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         ETAPA 4 - CABEÇALHO DA APLICAÇÃO
         ========================================================= -->

    <header class="header text-center">

        <div class="container">

            <h1 class="display-5 fw-bold">
                Gerenciador de Produtos
            </h1>

            <p class="lead mb-0">
                Treinamento de Gin Framework - Ralf Lima
            </p>

        </div>

    </header>


    <!-- =========================================================
         ETAPA 5 - CONTAINER PRINCIPAL
         ========================================================= -->

    <main class="container pb-5">


        <!-- =====================================================
             ETAPA 6 - ÁREA DE MENSAGENS
             ===================================================== -->

        <!--
            Essa div será utilizada pelo JavaScript
            para mostrar mensagens de sucesso ou erro.
        -->

        <div id="mensagem"></div>


        <!-- =====================================================
             ETAPA 7 - FORMULÁRIO DE PRODUTO
             ===================================================== -->

        <div class="card mb-4">

            <div class="card-header bg-white py-3">

                <h4 class="mb-0">
                    <span id="tituloFormulario">
                        Cadastrar Produto
                    </span>
                </h4>

            </div>


            <div class="card-body">

                <!--
                    O formulário será utilizado tanto para
                    cadastrar quanto para editar produtos.
                -->

                <form id="formProduto">

                    <div class="row g-3">


                        <!-- =====================================
                             CAMPO NOME
                             ===================================== -->

                        <div class="col-md-5">

                            <label
                                for="nome"
                                class="form-label"
                            >
                                Nome
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                placeholder="Digite o nome do produto"
                                required
                            >

                        </div>


                        <!-- =====================================
                             CAMPO CATEGORIA
                             ===================================== -->

                        <div class="col-md-4">

                            <label
                                for="categoria"
                                class="form-label"
                            >
                                Categoria
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="categoria"
                                placeholder="Ex.: Eletrônicos"
                                required
                            >

                        </div>


                        <!-- =====================================
                             CAMPO VALOR
                             ===================================== -->

                        <div class="col-md-3">

                            <label
                                for="valor"
                                class="form-label"
                            >
                                Valor
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="valor"
                                placeholder="0,00"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <!-- =====================================
                             BOTÕES DO FORMULÁRIO
                             ===================================== -->

                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="btnSalvar"
                            >
                                Cadastrar Produto
                            </button>


                            <!--
                                Esse botão inicialmente fica escondido.

                                Ele aparece somente quando estamos
                                editando um produto.
                            -->

                            <button
                                type="button"
                                class="btn btn-secondary d-none"
                                id="btnCancelar"
                            >
                                Cancelar edição
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- =====================================================
             ETAPA 8 - LISTAGEM DOS PRODUTOS
             ===================================================== -->

        <div class="card">

            <div class="card-header bg-white py-3">

                <div class="d-flex justify-content-between align-items-center">

                    <h4 class="mb-0">
                        Produtos cadastrados
                    </h4>

                </div>

            </div>


            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">

                            <tr>

                                <th>Código</th>

                                <th>Nome</th>

                                <th>Categoria</th>

                                <th>Valor</th>

                                <th class="text-center">
                                    Ações
                                </th>

                            </tr>

                        </thead>


                        <!--
                            O JavaScript irá preencher
                            esse tbody dinamicamente.
                        -->

                        <tbody id="tabelaProdutos">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         ETAPA 9 - MODAL DE CONFIRMAÇÃO DE EXCLUSÃO
         ========================================================= -->

    <!--
        Antes de excluir um produto, vamos perguntar
        ao usuário se ele realmente deseja continuar.
    -->

    <div
        class="modal fade"
        id="modalExcluir"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Confirmar exclusão
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <p class="mb-0">

                        Tem certeza que deseja excluir o produto

                        <strong id="nomeProdutoExcluir"></strong>?

                    </p>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>


                    <button
                        type="button"
                        class="btn btn-danger"
                        id="btnConfirmarExclusao"
                    >
                        Excluir
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         ETAPA 10 - JAVASCRIPT DO BOOTSTRAP
         ========================================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =========================================================
         ETAPA 11 - JAVASCRIPT DA APLICAÇÃO
         ========================================================= -->

    <script>

        /*
         * ========================================================
         * CONFIGURAÇÃO DA API
         * ========================================================
         *
         * Sua API Go está configurada para executar na porta 8080.
         *
         * Portanto:
         *
         * http://localhost:8080
         *
         * será nossa URL base.
         */

        const API_URL = "http://localhost:8080";


        /*
         * ========================================================
         * VARIÁVEIS GLOBAIS
         * ========================================================
         */

        /*
         * Guarda o código do produto que está sendo editado.
         *
         * Se for null:
         *     estamos cadastrando.
         *
         * Se tiver um código:
         *     estamos editando.
         */

        let codigoEdicao = null;


        /*
         * Guarda o código do produto que será excluído.
         */

        let codigoExclusao = null;


        /*
         * Cria a referência para o modal do Bootstrap.
         */

        const modalExcluir = new bootstrap.Modal(
            document.getElementById("modalExcluir")
        );


        /*
         * ========================================================
         * ETAPA 12 - QUANDO A PÁGINA FOR CARREGADA
         * ========================================================
         *
         * Assim que o HTML estiver pronto, vamos buscar
         * os produtos na API.
         */

        document.addEventListener("DOMContentLoaded", function () {

            listarProdutos();

        });


        /*
         * ========================================================
         * ETAPA 13 - LISTAR PRODUTOS
         * ========================================================
         *
         * Endpoint utilizado:
         *
         * GET /produtos
         *
         */

        async function listarProdutos() {

            const tabela = document.getElementById("tabelaProdutos");


            /*
             * Mostra uma mensagem enquanto a API responde.
             */

            tabela.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center p-4">
                        Carregando produtos...
                    </td>
                </tr>
            `;


            try {

                /*
                 * Faz a requisição GET.
                 */

                const resposta = await fetch(
                    `${API_URL}/produtos`
                );


                /*
                 * Verifica se a API retornou erro HTTP.
                 */

                if (!resposta.ok) {

                    throw new Error(
                        "Não foi possível carregar os produtos."
                    );

                }


                /*
                 * Converte a resposta para JSON.
                 */

                const produtos = await resposta.json();


                /*
                 * Limpa a tabela.
                 */

                tabela.innerHTML = "";


                /*
                 * Verifica se existem produtos.
                 */

                if (!produtos || produtos.length === 0) {

                    tabela.innerHTML = `
                        <tr>
                            <td colspan="5">
                                <div class="empty-message">
                                    <h5>Nenhum produto cadastrado</h5>
                                    <p class="mb-0">
                                        Cadastre o primeiro produto utilizando o formulário acima.
                                    </p>
                                </div>
                            </td>
                        </tr>
                    `;

                    return;
                }


                /*
                 * Percorre todos os produtos recebidos
                 * pela API.
                 */

                produtos.forEach(function (produto) {

                    /*
                     * Cria uma nova linha na tabela.
                     */

                    const linha = document.createElement("tr");


                    /*
                     * Formata o valor para o padrão brasileiro.
                     *
                     * Exemplo:
                     *
                     * 1500.5
                     *
                     * será exibido como:
                     *
                     * R$ 1.500,50
                     */

                    const valorFormatado =
                        Number(produto.valor).toLocaleString(
                            "pt-BR",
                            {
                                style: "currency",
                                currency: "BRL"
                            }
                        );


                    /*
                     * Insere os dados na linha.
                     */

                    linha.innerHTML = `

                        <td>
                            <small class="text-muted">
                                ${produto.codigo}
                            </small>
                        </td>

                        <td>
                            <strong>
                                ${produto.nome}
                            </strong>
                        </td>

                        <td>
                            <span class="badge text-bg-secondary">
                                ${produto.categoria}
                            </span>
                        </td>

                        <td>
                            ${valorFormatado}
                        </td>

                        <td class="text-center">

                            <button
                                class="btn btn-sm btn-warning btn-action"
                                onclick='editarProduto(${JSON.stringify(produto)})'
                            >
                                Editar
                            </button>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick='abrirModalExclusao(${JSON.stringify(produto)})'
                            >
                                Excluir
                            </button>

                        </td>
                    `;


                    /*
                     * Adiciona a linha na tabela.
                     */

                    tabela.appendChild(linha);

                });


            } catch (erro) {

                /*
                 * Caso aconteça algum problema de conexão,
                 * mostramos uma mensagem amigável.
                 */

                tabela.innerHTML = `
                    <tr>
                        <td colspan="5">

                            <div class="alert alert-danger m-3">

                                <strong>Erro!</strong>

                                Não foi possível conectar à API.

                                <br>

                                Verifique se o servidor Go está
                                executando em:

                                <strong>
                                    ${API_URL}
                                </strong>

                            </div>

                        </td>
                    </tr>
                `;

                console.error(erro);

            }

        }


        /*
         * ========================================================
         * ETAPA 14 - CADASTRAR OU ALTERAR PRODUTO
         * ========================================================
         *
         * O mesmo formulário será utilizado para:
         *
         * POST /produtos
         *
         * ou
         *
         * PUT /produtos/:codigo
         */

        document
            .getElementById("formProduto")
            .addEventListener("submit", async function (evento) {

                /*
                 * Impede o navegador de recarregar a página.
                 */

                evento.preventDefault();


                /*
                 * Obtém os valores digitados.
                 */

                const nome =
                    document.getElementById("nome").value.trim();

                const categoria =
                    document.getElementById("categoria").value.trim();

                const valor =
                    Number(document.getElementById("valor").value);


                /*
                 * Monta o objeto que será enviado para a API.
                 *
                 * Não precisamos enviar "codigo" no cadastro,
                 * porque o próprio Go gera o UUID.
                 */

                const produto = {

                    nome: nome,

                    categoria: categoria,

                    valor: valor

                };


                /*
                 * Referência do botão.
                 */

                const botao =
                    document.getElementById("btnSalvar");


                try {

                    /*
                     * ==================================================
                     * ALTERAÇÃO
                     * ==================================================
                     *
                     * Se codigoEdicao tiver um valor,
                     * estamos editando.
                     */

                    if (codigoEdicao) {

                        botao.disabled = true;

                        botao.textContent = "Salvando...";


                        const resposta = await fetch(
                            `${API_URL}/produtos/${codigoEdicao}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(produto)
                            }
                        );


                        /*
                         * Se a API retornar erro.
                         */

                        if (!resposta.ok) {

                            const erro = await resposta.json();

                            throw new Error(
                                erro.mensagem ||
                                erro.erro ||
                                "Erro ao alterar produto."
                            );

                        }


                        /*
                         * Mostra mensagem de sucesso.
                         */

                        mostrarMensagem(
                            "Produto alterado com sucesso!",
                            "success"
                        );


                    }

                    /*
                     * ==================================================
                     * CADASTRO
                     * ==================================================
                     *
                     * Se codigoEdicao for null,
                     * estamos cadastrando.
                     */

                    else {

                        botao.disabled = true;

                        botao.textContent = "Cadastrando...";


                        const resposta = await fetch(
                            `${API_URL}/produtos`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(produto)
                            }
                        );


                        /*
                         * Verifica se ocorreu algum erro.
                         */

                        if (!resposta.ok) {

                            const erro = await resposta.json();

                            throw new Error(
                                erro.mensagem ||
                                erro.erro ||
                                "Erro ao cadastrar produto."
                            );

                        }


                        /*
                         * Mostra mensagem de sucesso.
                         */

                        mostrarMensagem(
                            "Produto cadastrado com sucesso!",
                            "success"
                        );

                    }


                    /*
                     * Limpa o formulário.
                     */

                    limparFormulario();


                    /*
                     * Atualiza a tabela.
                     */

                    listarProdutos();


                } catch (erro) {

                    /*
                     * Mostra o erro para o usuário.
                     */

                    mostrarMensagem(
                        erro.message,
                        "danger"
                    );

                    console.error(erro);

                } finally {

                    /*
                     * Reativa o botão.
                     */

                    botao.disabled = false;

                    atualizarBotaoFormulario();

                }

            });


        /*
         * ========================================================
         * ETAPA 15 - EDITAR PRODUTO
         * ========================================================
         */

        function editarProduto(produto) {

            /*
             * Guarda o código do produto.
             */

            codigoEdicao = produto.codigo;


            /*
             * Preenche o formulário com os dados atuais.
             */

            document.getElementById("nome").value =
                produto.nome;

            document.getElementById("categoria").value =
                produto.categoria;

            document.getElementById("valor").value =
                produto.valor;


            /*
             * Altera o título do formulário.
             */

            document.getElementById(
                "tituloFormulario"
            ).textContent = "Editar Produto";


            /*
             * Altera o texto do botão.
             */

            document.getElementById(
                "btnSalvar"
            ).textContent = "Salvar Alterações";


            /*
             * Exibe o botão cancelar.
             */

            document.getElementById(
                "btnCancelar"
            ).classList.remove("d-none");


            /*
             * Leva o usuário até o formulário.
             */

            document
                .getElementById("formProduto")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


        /*
         * ========================================================
         * ETAPA 16 - CANCELAR EDIÇÃO
         * ========================================================
         */

        document
            .getElementById("btnCancelar")
            .addEventListener("click", function () {

                limparFormulario();

            });


        /*
         * ========================================================
         * ETAPA 17 - LIMPAR FORMULÁRIO
         * ========================================================
         */

        function limparFormulario() {

            /*
             * Limpa os campos.
             */

            document
                .getElementById("formProduto")
                .reset();


            /*
             * Remove o código de edição.
             */

            codigoEdicao = null;


            /*
             * Restaura título e botão.
             */

            atualizarBotaoFormulario();


            /*
             * Esconde o botão cancelar.
             */

            document
                .getElementById("btnCancelar")
                .classList.add("d-none");

        }


        /*
         * ========================================================
         * ETAPA 18 - ATUALIZAR TEXTO DO BOTÃO
         * ========================================================
         */

        function atualizarBotaoFormulario() {

            const titulo =
                document.getElementById(
                    "tituloFormulario"
                );

            const botao =
                document.getElementById(
                    "btnSalvar"
                );


            if (codigoEdicao) {

                titulo.textContent =
                    "Editar Produto";

                botao.textContent =
                    "Salvar Alterações";

            } else {

                titulo.textContent =
                    "Cadastrar Produto";

                botao.textContent =
                    "Cadastrar Produto";

            }

        }


        /*
         * ========================================================
         * ETAPA 19 - ABRIR MODAL DE EXCLUSÃO
         * ========================================================
         */

        function abrirModalExclusao(produto) {

            /*
             * Guarda o código do produto.
             */

            codigoExclusao = produto.codigo;


            /*
             * Mostra o nome no modal.
             */

            document.getElementById(
                "nomeProdutoExcluir"
            ).textContent = produto.nome;


            /*
             * Abre o modal.
             */

            modalExcluir.show();

        }


        /*
         * ========================================================
         * ETAPA 20 - CONFIRMAR EXCLUSÃO
         * ========================================================
         *
         * Endpoint:
         *
         * DELETE /produtos/:codigo
         */

        document
            .getElementById("btnConfirmarExclusao")
            .addEventListener("click", async function () {

                /*
                 * Se não existir código,
                 * não fazemos nada.
                 */

                if (!codigoExclusao) {

                    return;

                }


                const botao =
                    document.getElementById(
                        "btnConfirmarExclusao"
                    );


                try {

                    botao.disabled = true;

                    botao.textContent = "Excluindo...";


                    /*
                     * Faz a requisição DELETE.
                     */

                    const resposta = await fetch(
                        `${API_URL}/produtos/${codigoExclusao}`,
                        {
                            method: "DELETE"
                        }
                    );


                    /*
                     * Verifica se ocorreu erro.
                     */

                    if (!resposta.ok) {

                        const erro = await resposta.json();

                        throw new Error(
                            erro.mensagem ||
                            erro.erro ||
                            "Erro ao excluir produto."
                        );

                    }


                    /*
                     * Fecha o modal.
                     */

                    modalExcluir.hide();


                    /*
                     * Mostra mensagem de sucesso.
                     */

                    mostrarMensagem(
                        "Produto removido com sucesso!",
                        "success"
                    );


                    /*
                     * Atualiza a lista.
                     */

                    listarProdutos();


                } catch (erro) {

                    mostrarMensagem(
                        erro.message,
                        "danger"
                    );

                    console.error(erro);

                } finally {

                    /*
                     * Restaura o botão.
                     */

                    botao.disabled = false;

                    botao.textContent = "Excluir";

                    codigoExclusao = null;

                }

            });


        /*
         * ========================================================
         * ETAPA 21 - EXIBIR MENSAGENS
         * ========================================================
         *
         * tipo:
         *
         * success -> verde
         * danger  -> vermelho
         * warning -> amarelo
         * info    -> azul
         */

        function mostrarMensagem(texto, tipo) {

            const elemento =
                document.getElementById("mensagem");


            elemento.innerHTML = `

                <div
                    class="alert alert-${tipo} alert-dismissible fade show"
                    role="alert"
                >

                    ${texto}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                    ></button>

                </div>

            `;


            /*
             * Após 4 segundos,
             * remove automaticamente a mensagem.
             */

            setTimeout(function () {

                const alerta =
                    elemento.querySelector(".alert");

                if (alerta) {

                    alerta.remove();

                }

            }, 4000);

        }

    </script>

</body>

</html>
